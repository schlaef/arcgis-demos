<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Arcgis Assistant component </title>
    <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
    <script type="module" src="https://js.arcgis.com/5.2/"></script>
    <style>
      #code-dialog {
        padding:5px;
        /* --calcite-dialog-min-size-x: min(300px, calc(100vw - 3rem));
        --calcite-dialog-max-size-x: min(300px, calc(100vw - 3rem));
        --calcite-dialog-min-size-y: min(400px, calc(100vh - 3rem));
        --calcite-dialog-max-size-y: min(400px, calc(100vh - 3rem)); */
      }

      #value-picker-snippets {
        box-sizing: border-box;
        height: min(10rem, calc(100vh - 7rem));
      }

      @media (max-width: 600px) {
        #value-picker-snippets {
          height: min(20rem, calc(100vh - 7rem));
        }
      }
    </style>
  </head>

  <body>
    <p id="auth-status" role="status">Connecting to ArcGIS Online...</p>
    <button id="retry-sign-in" type="button" hidden>Retry sign-in</button>

    <template id="app-template">
      <calcite-shell>
         <calcite-dialog modal fullscreen-disabled heading="Assistant and Agents" 
         id="code-dialog" width="m" slot="dialogs">
          
                    <arcgis-code-editor style="padding: 5px;" id="value-picker-snippets" language="html" 
                    value='<arcgis-assistant
    heading="Bauzonen und Liegenschaften der Stadt ZH"
    entry-message="Hallo, ich kann Bauzonen auffinden, Statistiken abfragen und Symbologien ändern">
    <arcgis-assistant-navigation-agent/>
    <arcgis-assistant-data-exploration-agent/>
    <arcgis-assistant-help-agent/>
</arcgis-assistant>  '>
                  </arcgis-code-editor>    

        </calcite-dialog> 
        <arcgis-map id="zpl-map" item-id="617e7ab0f3894c7493d09277ecd5c908">
          <arcgis-zoom slot="top-left"></arcgis-zoom>          
            <arcgis-legend slot="bottom-left" ></arcgis-legend>            
          <arcgis-expand slot="top-left">
            <arcgis-layer-list ></arcgis-layer-list>
          </arcgis-expand>          
          <calcite-button id="toggle-code-dialog" icon-start="code" appearance="outline-fill" slot="top-right"></calcite-button>
          <calcite-button id="reset-symbology" icon-start="reset" appearance="outline-fill" slot="top-left" disabled></calcite-button>
        </arcgis-map>
        <arcgis-feature-table id="ftable" style="height: 450px;"
          map-layer-id = "1a1f4b90958-layer-42"
          reference-element="zpl-map"
          show-layer-dropdown
          hide-selection-column
          hide-column-descriptions
          hide-column-visibility-menu
        ></arcgis-feature-table>
        <calcite-shell-panel resizable slot="panel-end" width="l" id="assistant-panel">
          <calcite-panel>
            <calcite-notice id="symbology-error" kind="danger" icon>
              <div slot="message">Die Originaldarstellung konnte nicht vorbereitet werden. Bitte die Seite neu laden.</div>
            </calcite-notice>
            <arcgis-assistant
              log-enabled   
              keep-suggested-prompts  
              user-avatar-enabled         
              reference-element="#zpl-map"
              heading="Bauzonen und Liegenschaften der Stadt ZH"
              description="Bauzonen analysieren"
              entry-message="Hallo, ich kann Bauzonen auffinden, Statistiken abfragen und Symbologien ändern"
            >
              <arcgis-assistant-navigation-agent/>
              <arcgis-assistant-data-exploration-agent/>
              <arcgis-assistant-help-agent/>
            </arcgis-assistant>
           
          </calcite-panel>
        </calcite-shell-panel>
      </calcite-shell>
    </template>

    <script type="module">
      const status = document.querySelector("#auth-status");
      const retryButton = document.querySelector("#retry-sign-in");
      const redirectKey = "arcgis-assistant-oauth-pending";

      function toggleDialog() {
        const dialog = document.querySelector("#code-dialog");
        dialog.open = !dialog.open;
      }

      function toggleColdesc() {
        const featureTable = document.querySelector("#ftable");
        featureTable.hideColumnDescriptions = !featureTable.hideColumnDescriptions;
      }

      function showError(message, error) {
        console.error(message, error);
        status.textContent = message;
        status.setAttribute("role", "alert");
        retryButton.hidden = false;
      }

      try {
        const [OAuthInfo, identityManager] = await $arcgis.import([
          "@arcgis/core/identity/OAuthInfo.js",
          "@arcgis/core/identity/IdentityManager.js",
        ]);
        const info = new OAuthInfo({
          appId: "eu2IMaR34FDD3NkT",
          portalUrl: "https://www.arcgis.com",
          authNamespace: "arcgis-assistant-vanilla",
          popup: false,
        });
        const sharingUrl = `${info.portalUrl}/sharing`;
        identityManager.registerOAuthInfos([info]);

        function showApp() {
          sessionStorage.removeItem(redirectKey);
          status.remove();
          retryButton.remove();
          document.body.append(document.querySelector("#app-template").content.cloneNode(true));
          document.querySelector("#toggle-code-dialog").addEventListener("click", toggleDialog);
          customElements.whenDefined("arcgis-feature-table").then(() => {
            document.querySelector("#ftable").menuConfig = {
              items: [{
                label: "Spaltenbeschreibungen ein-/ausblenden",
                icon: "table",
                clickFunction: toggleColdesc,
              }],
            };
          });

          const mapElement = document.querySelector("#zpl-map");
          const resetButton = document.querySelector("#reset-symbology");
          customElements.whenDefined("arcgis-map").then(async () => {
            await mapElement.viewOnReady();
            const originalEffects = await Promise.all(
              mapElement.map.allLayers
                .filter((layer) => layer.type === "feature")
                .toArray()
                .map(async (layer) => {
                  await layer.load();
                  return { layer, featureEffect: layer.featureEffect?.clone() ?? null };
                }),
            );
            resetButton.addEventListener("click", () => {
              for (const { layer, featureEffect } of originalEffects) {
                layer.featureEffect = featureEffect?.clone() ?? null;
              }
            });
            resetButton.disabled = false;
          }).catch((error) => {
            console.error("Could not prepare original layer effects.", error);
            document.querySelector("#symbology-error").open = true;
          });
          
          customElements.whenDefined("arcgis-code-editor").then(() => {
            document.querySelector("#value-picker-snippets").editorOptions = {
              wordWrap: "on",
              scrollBeyondLastLine: false,
            };
          });
          document.querySelector("arcgis-assistant").suggestedPrompts = [
            "Gib mir eine Liste von vorhandenen Zonen zusammen mit ihrer Bedeutung und ergänze eine Spalte für die Flächensummen pro Zonentyp.",            
            "In welchem Zonentyp liegt die Adresse Josefstrasse 218? Highlighte die Zone",
            "Wie gross ist die Grünflächenziffer in W4?",
          ];
        }

        async function signIn() {
          retryButton.hidden = true;
          status.setAttribute("role", "status");
          status.textContent = "Connecting to ArcGIS Online...";
          try {
            sessionStorage.setItem(redirectKey, "1");
            await identityManager.getCredential(sharingUrl);
            showApp();
          } catch (error) {
            sessionStorage.removeItem(redirectKey);
            showError("ArcGIS sign-in failed. Check the browser console and retry.", error);
          }
        }

        retryButton.addEventListener("click", signIn);
        try {
          await identityManager.checkSignInStatus(sharingUrl);
          showApp();
        } catch (error) {
          if (sessionStorage.getItem(redirectKey)) {
            sessionStorage.removeItem(redirectKey);
            showError("ArcGIS sign-in did not complete. Check the redirect URI and retry.", error);
          } else {
            await signIn();
          }
        }
      } catch (error) {
        showError("Could not initialize ArcGIS sign-in. Reload the page to retry.", error);
        retryButton.hidden = true;
      }
    </script>
  </body>
</html>
